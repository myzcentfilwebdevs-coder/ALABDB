name: Sync AlabDB to Neon PostgreSQL

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  sync-neon-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AlabDB Repo
        uses: actions/checkout@v4

      - name: Install YAML and PostgreSQL Driver
        run: pip install pyyaml cryptography psycopg2-binary

      - name: Connect via neon.yml and Run .sql / .yml Files
        env:
          ALAB_MASTER_KEY: ${{ secrets.ALAB_MASTER_KEY || '454d6e53fa18901a8076f714664dee292d9932ff62150bbb0920e7ccb1cad2c8' }}
        run: |
          python3 - << 'EOF'
          import os, glob, base64, hashlib, yaml, psycopg2
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          def get_master_key():
              raw = os.environ.get("ALAB_MASTER_KEY", "").strip().strip("'\"")
              if len(raw) == 64:
                  return bytes.fromhex(raw)
              return hashlib.sha256(raw.encode()).digest()

          def decrypt_val(val):
              val = str(val or "").strip().strip("'\"")
              if not val.startswith("ENC:"):
                  return val
              raw = base64.b64decode(val[4:])
              nonce, ct = raw[:12], raw[12:]
              return AESGCM(get_master_key()).decrypt(nonce, ct, None).decode()

          with open("neon.yml", "r", encoding="utf-8") as fp:
              neon_cfg = (yaml.safe_load(fp) or {}).get("databases") or {}

          connections = {}
          for db_name, c in neon_cfg.items():
              connections[db_name] = {
                  "host": decrypt_val(c.get("host")),
                  "dbname": decrypt_val(c.get("database")),
                  "user": decrypt_val(c.get("user")),
                  "password": decrypt_val(c.get("password")),
                  "port": str(c.get("port", "5432")),
                  "sslmode": str(c.get("sslmode", "require")),
              }

          # 1. Execute all .sql files in the repo
          sql_files = sorted(glob.glob("**/*.sql", recursive=True))
          if sql_files:
              conn = psycopg2.connect(**connections["default"])
              conn.autocommit = True
              cur = conn.cursor()
              for sql_path in sql_files:
                  with open(sql_path, "r", encoding="utf-8") as sfp:
                      sql_query = sfp.read().strip()
                  if sql_query:
                      cur.execute(sql_query)
                      print(f"[OK] Executed SQL file: {sql_path}")
              cur.close()
              conn.close()

          # 2. Execute any .yml schema files (excluding neon.yml and .github)
          yml_files = [
              f for f in glob.glob("**/*.y*ml", recursive=True)
              if not f.startswith(".github") and os.path.basename(f) != "neon.yml"
          ]

          for path in sorted(yml_files):
              with open(path, "r", encoding="utf-8") as fp:
                  data = yaml.safe_load(fp) or {}

              target_db = data.get("database", "default")
              if target_db not in connections:
                  continue

              conn = psycopg2.connect(**connections[target_db])
              conn.autocommit = True
              cur = conn.cursor()

              tables = data.get("tables") or {}
              for table_name, tdef in tables.items():
                  cols = (tdef or {}).get("columns") or {}
                  if not cols:
                      continue
                  col_defs = [f'"{col}" {ctype}' for col, ctype in cols.items()]
                  cur.execute(f'CREATE TABLE IF NOT EXISTS "{table_name}" ({", ".join(col_defs)});')
                  for col, ctype in cols.items():
                      if "PRIMARY KEY" not in str(ctype).upper():
                          cur.execute(f'ALTER TABLE "{table_name}" ADD COLUMN IF NOT EXISTS "{col}" {ctype};')
                  print(f"[OK] Auto-added/updated table '{table_name}' on DB '{target_db}' (from {path})")

              if data.get("sql"):
                  cur.execute(data["sql"])
                  print(f"[OK] Executed SQL from {path} on DB '{target_db}'")

              cur.close()
              conn.close()

          # 3. Print final DB storage & table count
          for db_name, cfg in connections.items():
              conn = psycopg2.connect(**cfg)
              cur = conn.cursor()
              cur.execute("SELECT pg_size_pretty(pg_database_size(current_database())), (SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public');")
              size_pretty, table_count = cur.fetchone()
              print(f"[DB] Connected: '{db_name}' | Storage: {size_pretty} | Total Tables: {table_count}")
              cur.close()
              conn.close()
          EOF
