name: Sync AlabDB to Neon PostgreSQL

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: 'Piliin ang Deploy Mode'
        required: true
        default: 'schema_only'
        type: choice
        options:
          - schema_only
          - run_backup_and_schema
          - full_reset

jobs:
  sync-neon-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AlabDB Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install YAML and PostgreSQL Driver
        run: pip install pyyaml cryptography psycopg2-binary

      - name: Check if backup/backup.txt was modified
        id: check_backup
        run: |
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          else
            CHANGED=""
          fi
          echo "Changed files in this push:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -q "^backup/"; then
            echo "backup_modified=true" >> $GITHUB_OUTPUT
          else
            echo "backup_modified=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Schema to Neon DB
        env:
          ALAB_MASTER_KEY: ${{ secrets.ALAB_MASTER_KEY || '454d6e53fa18901a8076f714664dee292d9932ff62150bbb0920e7ccb1cad2c8' }}
          DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || 'schema_only' }}
          BACKUP_MODIFIED: ${{ steps.check_backup.outputs.backup_modified }}
        run: |
          python3 - << 'EOF'
          import os, glob, base64, hashlib, yaml, psycopg2
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          def get_master_key():
              raw = os.environ.get("ALAB_MASTER_KEY", "").strip().strip("'\"")
              if len(raw) == 64:
                  return bytes.fromhex(raw)
              return hashlib.sha256(raw.encode()).digest()

          def decrypt_val(val):
              val = str(val or "").strip().strip("'\"")
              if not val.startswith("ENC:"):
                  return val
              raw = base64.b64decode(val[4:])
              nonce, ct = raw[:12], raw[12:]
              return AESGCM(get_master_key()).decrypt(nonce, ct, None).decode()

          with open("neon.yml", "r", encoding="utf-8") as fp:
              neon_cfg = (yaml.safe_load(fp) or {}).get("databases") or {}

          connections = {}
          for db_name, c in neon_cfg.items():
              connections[db_name] = {
                  "host": decrypt_val(c.get("host")),
                  "dbname": decrypt_val(c.get("database")),
                  "user": decrypt_val(c.get("user")),
                  "password": decrypt_val(c.get("password")),
                  "port": str(c.get("port", "5432")),
                  "sslmode": str(c.get("sslmode", "require")),
              }

          deploy_mode = os.environ.get("DEPLOY_MODE", "schema_only")
          backup_modified = os.environ.get("BACKUP_MODIFIED", "false") == "true"

          conn = psycopg2.connect(**connections["default"])
          conn.autocommit = True
          cur = conn.cursor()

          if deploy_mode == "full_reset":
              cur.execute("DROP SCHEMA public CASCADE; CREATE SCHEMA public;")
              print("[RESET] Dropped and recreated public schema.")

          # 1. Check backup/backup.txt
          run_backup = (deploy_mode in ("run_backup_and_schema", "full_reset"))
          if run_backup:
              for bpath in sorted(glob.glob("backup/*.txt") + glob.glob("backup/*.sql")):
                  with open(bpath, "r", encoding="utf-8") as bfp:
                      bsql = bfp.read().strip()
                  if bsql:
                      cur.execute(bsql)
                      print(f"[BACKUP-RUN] Executed {bpath}")
          else:
              print("[SKIP] backup/backup.txt skipped (preserving all finished/tested tables in DB).")

          # 2. Run only root schema.sql (active console)
          if os.path.exists("schema.sql"):
              with open("schema.sql", "r", encoding="utf-8") as sfp:
                  sql_query = sfp.read().strip()
              if sql_query:
                  cur.execute(sql_query)
                  print("[OK] Executed active schema.sql")
              else:
                  print("[INFO] schema.sql is empty, nothing new to execute.")

          cur.execute("SELECT pg_size_pretty(pg_database_size(current_database())), (SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public');")
          size_pretty, table_count = cur.fetchone()
          cur.execute("SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' ORDER BY table_name;")
          table_names = [r[0] for r in cur.fetchall()]
          print(f"[DB] Connected: 'default' | Storage: {size_pretty} | Total Tables: {table_count} {table_names}")
          cur.close()
          conn.close()
          EOF
